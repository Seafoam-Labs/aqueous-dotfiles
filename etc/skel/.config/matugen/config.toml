[config]

[templates.aqueous_settings]
input_path = '/usr/share/aqueous/settings-application/themes/dms.json.in'
output_path = '~/.cache/aqueous/settings-application/themes/dms.json'

[templates.equibop]
input_path = '~/.config/matugen/templates/discord.css'
output_path = '~/.config/equibop/themes/midnight.css'

[templates.fluxer]
input_path = '~/.config/matugen/templates/fluxer.css'
output_path = '~/.config/matugen/theme_output/fluxer_matugen.css'

[templates.obsidian]
input_path = '~/.config/matugen/templates/obsidian.css'
output_path = '/path/to/your/vault/.obsidian/snippets/matugen.css'

[templates.starship]
input_path = '~/.config/matugen/templates/starship.toml'
output_path = '~/.config/starship.toml'

[templates.steam]
input_path = '~/.config/matugen/templates/steam.css'
output_path = '~/.config/AdwSteamGtk/custom.css'
post_hook = 'adwaita-steam-gtk -i'

[templates.zed]
input_path = '~/.config/matugen/templates/zed-colors.json'
output_path = '~/.config/zed/themes/matugen.json'
